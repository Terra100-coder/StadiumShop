<section class="product-list container py-4 py-md-5">
  <header class="product-list__header">
    <p class="product-list__eyebrow">Stadium Shop</p>
    <h1>Nos produits</h1>
    <p>Les équipements de vos équipes, sélectionnés pour le terrain comme pour les tribunes.</p>
  </header>

  <div *ngIf="isLoading" class="product-list__loading" aria-live="polite">
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    Chargement des produits…
  </div>

  <div *ngIf="!isLoading && errorMessage" class="alert alert-danger product-list__message" role="alert">
    <p class="mb-3">{{ errorMessage }}</p>
    <button class="btn btn-outline-danger" type="button" (click)="loadProducts()">Réessayer</button>
  </div>

  <div *ngIf="!isLoading && !errorMessage && products.length === 0" class="product-list__message">
    <h2>Aucun produit disponible</h2>
    <p class="mb-0">Revenez bientôt pour découvrir notre sélection.</p>
  </div>

  <div *ngIf="!isLoading && !errorMessage && products.length > 0" class="row g-4">
    <div *ngFor="let product of products" class="col-12 col-md-6 col-xl-4 col-xxl-3">
      <app-product-card [product]="product" />
    </div>
  </div>
</section>
